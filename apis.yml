aid: caplinked
name: Caplinked
description: >-
  CapLinked is a secure virtual data room (VDR) provider used for M&A, fundraising,
  due diligence, audits, and other confidential document workflows. The CapLinked
  API is a RESTful, JSON API secured by HMAC-SHA256 request signing (TLS + signed
  requests) that lets developers embed CapLinked's information-security controls into
  their own applications: protect and encrypt files in secure cloud storage, configure
  Access Control List (ACL) privileges, apply enterprise Digital Rights Management (DRM)
  to Microsoft Office and PDF files, generate dynamic watermarks, produce exhaustive
  activity and audit-trail reports, and run OCR-backed search over stored files. The API
  models an Organization > Team > Workspace hierarchy containing Folders, Files, Groups,
  Permissions, Activities, Uploads, Downloads, and Watermarks, and ships official SDKs for
  Node.js, Ruby, PHP, C#/.NET, and Python. It supports search, pagination, and filtering.
